name: CI

# Reglas de docs/ESPEC_ci_y_deudas.md (C5):
#   - se dispara en push y en pull_request;
#   - permissions: contents: read, y cada checkout con persist-credentials: false;
#   - toda acción de terceros fijada por SHA (no por tag flotante);
#   - ningún secrets.* ni clave en este archivo.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  POETRY_VERSION: "2.5.1"
  PYTHON_VERSION: "3.12"

jobs:
  # ruff + mypy + los tests que no necesitan Docker (76 passed, espec §0).
  calidad:
    name: Lint, tipos y tests sin Docker
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar poetry (versión fija)
        run: pip install "poetry==${{ env.POETRY_VERSION }}"

      - name: Confirmar que el lock está al día con pyproject.toml
        run: poetry check --lock

      - name: Instalar dependencias (con dev)
        run: poetry install --with dev

      - name: ruff
        run: poetry run ruff check .

      - name: mypy
        run: poetry run mypy .

      - name: pytest -m "not integ" (debe dar 76 passed)
        run: poetry run pytest -m "not integ"

  # Suite completa contra Postgres real en Docker (163 passed, 0 xfailed; espec BUG-3..9 §2).
  integ:
    name: Tests de integración (Postgres real en Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clonar el repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar poetry (versión fija)
        run: pip install "poetry==${{ env.POETRY_VERSION }}"

      - name: Confirmar que el lock está al día con pyproject.toml
        run: poetry check --lock

      - name: Instalar dependencias (con dev)
        run: poetry install --with dev

      # La imagen pesa ~370 MB: si se descarga recién al arrancar la fixture,
      # se come el timeout de 90s de `levantar_contenedor` (tests/integ_db.py).
      # Bajarla antes, fuera de ese reloj, evita el falso rojo por lentitud.
      - name: docker pull de la imagen de Postgres antes de la suite
        run: |
          set -euo pipefail
          IMAGEN=$(poetry run python -c "from tests.integ_db import IMAGEN; print(IMAGEN)")
          docker pull "$IMAGEN"

      - name: pytest completo (debe dar 163 passed / 0 xfailed)
        run: poetry run pytest

      - name: Subir humo_integ.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: humo_integ
          path: tests/_salida/humo_integ.json
          if-no-files-found: warn

  # gitleaks sobre todo el historial. No se usa gitleaks-action (pide licencia
  # a las organizaciones); la ADR-003 eligió el binario oficial (MIT).
  secretos:
    name: gitleaks sobre el historial
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo (historial completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks (binario oficial, SHA-256 verificado)
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          ARCHIVO="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$ARCHIVO" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVO}"
          echo "${SHA256}  ${ARCHIVO}" | sha256sum -c -
          tar -xzf "$ARCHIVO" gitleaks
          chmod +x gitleaks

      - name: gitleaks git --redact (debe salir en 0; .gitleaks.toml justifica lo sintético)
        run: ./gitleaks git --redact --exit-code 1
